name: Continuous Testing and Publication

on: [ push ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run-py-linter:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout this repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          lfs: true

      - name: Checkout actions repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: mat3ra/actions
          token: ${{ secrets.BOT_GITHUB_TOKEN }}
          path: actions

      - name: Run ruff linter
        uses: ./actions/py/lint
        with:
          ruff-version: 0.15.20

  run-py-tests:
    needs: run-py-linter
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - 3.10.x
          - 3.11.x
          - 3.12.x
          # Ucomment after updating dependencies (e.g. pymatgen)
          # - 3.13.x

    steps:
      - name: Checkout this repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          lfs: true

      - name: Checkout actions repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: mat3ra/actions
          token: ${{ secrets.BOT_GITHUB_TOKEN }}
          path: actions

      - name: Run python unit tests
        uses: ./actions/py/pytest
        with:
          python-version: ${{ matrix.python-version }}
          unit-test-directory: tests/py/unit
          bot-ssh-key: ${{ secrets.BOT_GITHUB_KEY }}

  run-py-tests-pyodide:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout this repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          lfs: true

      - name: Run the nudged-build tests in Pyodide 0.24.1, the JupyterLite runtime
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: 0.0.0
          WHEELS_URL: https://media.githubusercontent.com/media/mat3ra/api-examples/main/packages
        run: |
          WHEELS="$RUNNER_TEMP/wheels"
          for wheel in pymatgen-2024.4.13 spglib-2.0.2 ruamel.yaml-0.17.32 pydantic_core-2.18.2 pydantic-2.7.1; do
            curl -sSfL --create-dirs -o "$WHEELS/$wheel-py3-none-any.whl" "$WHEELS_URL/$wheel-py3-none-any.whl"
          done
          python3 -m pip wheel --no-deps -w "$WHEELS" .
          npm install --prefix "$RUNNER_TEMP/pyodide" pyodide@0.24.1
          cp scripts/run-pytest-in-pyodide.mjs "$RUNNER_TEMP/pyodide/"
          node "$RUNNER_TEMP/pyodide/run-pytest-in-pyodide.mjs" "$PWD" "$WHEELS" tests/py/unit/test_nudged_builds.py

  run-js-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
          - 20.x
          - 22.x

    steps:
      - name: Checkout this repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          lfs: true

      - name: Checkout actions repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: mat3ra/actions
          token: ${{ secrets.BOT_GITHUB_TOKEN }}
          path: actions

      - name: Run JS validate
        uses: ./actions/js/validate
        with:
          node-version: '20.x'
          skip-eslint: 'true'

      - name: Run JS tests
        uses: ./actions/js/test
        with:
          node-version: ${{ matrix.node-version }}

  publish-js-package:
    needs:
      - run-js-tests
      - run-py-tests
      - run-py-linter
    runs-on: ubuntu-latest
    if: (github.repository != 'Exabyte-io/template-definitions-js-py') && (github.ref_name == 'main')

    steps:
      - name: Checkout this repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Checkout actions repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: mat3ra/actions
          token: ${{ secrets.BOT_GITHUB_TOKEN }}
          path: actions

      - name: Publish JS release
        uses: ./actions/js/publish
        with:
          node-version: 20.x
          npm-token: ${{ secrets.NPM_TOKEN }}
          github-token: ${{ secrets.BOT_GITHUB_TOKEN }}
          verify-tests: 'false'

  publish-py-package:
    needs:
      - run-js-tests
      - run-py-tests
      - run-py-linter
      # Wait for JS publish step to publish the new tag
      - publish-js-package
    runs-on: ubuntu-24.04
    if: (github.repository != 'Exabyte-io/template-definitions-js-py') && (github.ref_name == 'main')

    steps:
      - name: Checkout this repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          lfs: true

      - name: Checkout actions repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: mat3ra/actions
          token: ${{ secrets.BOT_GITHUB_TOKEN }}
          path: actions

      - name: Publish python release
        uses: ./actions/py/publish
        with:
          python-version: 3.10.13
          github-token: ${{ secrets.BOT_GITHUB_TOKEN }}
          pypi-api-token: ${{ secrets.PYPI_API_TOKEN }}
          publish-tag: 'false'
