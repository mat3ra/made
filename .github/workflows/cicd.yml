name: Continuous Testing and Publication

on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run-py-linter:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Checkout multi-consumer root
        uses: actions/checkout@v7
        with:
          repository: mat3ra/web-app
          # TODO: use main after references runner lands on web-app main
          ref: chore/SOF-7942
          token: ${{ secrets.BOT_GITHUB_TOKEN }}
          path: root

      - name: Initialize multi-consumer root
        uses: ./root/.github/actions/init-multi-consumer-root
        with:
          multi-consumer-root: root
          ssh-private-key: ${{ secrets.BOT_GITHUB_KEY }}
          # TODO: drop actions-ref after post-npm-install lands on actions main
          actions-ref: chore/SOF-7942

      - name: Run ruff linter
        uses: ./root/reference/actions/py/lint
        with:
          ruff-version: 0.15.20

  run-py-tests:
    needs: run-py-linter
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - 3.10.x
          - 3.11.x
          - 3.12.x
          # Ucomment after updating dependencies (e.g. pymatgen)
          # - 3.13.x

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Checkout multi-consumer root
        uses: actions/checkout@v7
        with:
          repository: mat3ra/web-app
          ref: chore/SOF-7942
          token: ${{ secrets.BOT_GITHUB_TOKEN }}
          path: root

      - name: Initialize multi-consumer root
        uses: ./root/.github/actions/init-multi-consumer-root
        with:
          multi-consumer-root: root
          ssh-private-key: ${{ secrets.BOT_GITHUB_KEY }}
          actions-ref: chore/SOF-7942

      - name: Run python unit tests
        uses: ./root/reference/actions/py/pytest
        with:
          python-version: ${{ matrix.python-version }}
          unit-test-directory: tests/py/unit
          bot-ssh-key: ${{ secrets.BOT_GITHUB_KEY }}

  run-js-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
          - 20.x
          - 22.x

    steps:
      - name: Checkout multi-consumer root
        uses: actions/checkout@v7
        with:
          repository: mat3ra/web-app
          # TODO: use main after references runner lands on web-app main
          ref: chore/SOF-7942
          token: ${{ secrets.BOT_GITHUB_TOKEN }}
          path: root
          lfs: true

      - name: Checkout package under test
        uses: actions/checkout@v7
        with:
          path: root/reference/made
          lfs: true

      - name: Initialize multi-consumer root
        uses: ./root/.github/actions/init-multi-consumer-root
        with:
          multi-consumer-root: root
          ssh-private-key: ${{ secrets.BOT_GITHUB_KEY }}
          node-version: ${{ matrix.node-version }}
          # TODO: drop actions-ref after post-npm-install lands on actions main
          actions-ref: chore/SOF-7942

      - name: Run JS validate
        uses: ./root/reference/actions/js/validate
        with:
          node-version: ${{ matrix.node-version }}
          package-directory: root/reference/made
          skip-eslint: "true"

      - name: Run JS tests
        uses: ./root/reference/actions/js/test
        with:
          node-version: ${{ matrix.node-version }}
          package-directory: root/reference/made
          npm-options: "--legacy-peer-deps"
          post-npm-install: |
            npm run references:sync
            npm run references:install

  publish-js-package:
    needs:
      - run-js-tests
      - run-py-tests
      - run-py-linter
    runs-on: ubuntu-latest
    if: (github.repository != 'Exabyte-io/template-definitions-js-py') && (github.ref_name == 'main')

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v7

      - name: Checkout multi-consumer root
        uses: actions/checkout@v7
        with:
          repository: mat3ra/web-app
          token: ${{ secrets.BOT_GITHUB_TOKEN }}
          path: root

      - name: Initialize multi-consumer root
        uses: ./root/.github/actions/init-multi-consumer-root
        with:
          multi-consumer-root: root
          ssh-private-key: ${{ secrets.BOT_GITHUB_KEY }}

      - name: Publish JS release
        uses: ./root/reference/actions/js/publish
        with:
          node-version: 20.x
          npm-token: ${{ secrets.NPM_TOKEN }}
          github-token: ${{ secrets.BOT_GITHUB_TOKEN }}
          verify-tests: "false"

  publish-py-package:
    needs:
      - run-js-tests
      - run-py-tests
      - run-py-linter
      # Wait for JS publish step to publish the new tag
      - publish-js-package
    runs-on: ubuntu-latest
    if: (github.repository != 'Exabyte-io/template-definitions-js-py') && (github.ref_name == 'main')

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Checkout multi-consumer root
        uses: actions/checkout@v7
        with:
          repository: mat3ra/web-app
          token: ${{ secrets.BOT_GITHUB_TOKEN }}
          path: root

      - name: Initialize multi-consumer root
        uses: ./root/.github/actions/init-multi-consumer-root
        with:
          multi-consumer-root: root
          ssh-private-key: ${{ secrets.BOT_GITHUB_KEY }}

      - name: Publish python release
        uses: ./root/reference/actions/py/publish
        with:
          python-version: 3.10.13
          github-token: ${{ secrets.BOT_GITHUB_TOKEN }}
          pypi-api-token: ${{ secrets.PYPI_API_TOKEN }}
          publish-tag: "false"
